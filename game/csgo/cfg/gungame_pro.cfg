// gungame_pro.cfg
//
// PUT THIS FILE IN:
//   D:\SteamLibrary\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\gungame_pro.cfg
//
// RUN IT WITH (in the developer console, after the map has loaded):
//   exec gungame_pro
//
// WHAT THIS DOES:
//   Sets up an offline defusal match against bots where:
//     - no grenades or utility exist for anyone, humans included
//     - no sniper rifles exist for anyone, humans included
//     - bots are locked at maximum difficulty and will not be auto-nerfed
//     - bots play the objective and coordinate rather than wandering off alone
//
// WHAT THIS DOES NOT DO:
//   It does not change bot pathing, bot site selection, or bot reaction time.
//   Those live in the behaviour tree system, which is the optional second half
//   of this setup. See bt_probe.kv3 and bt_config.kv3.


// SECTION 1 - SERVER BASICS

// Some of the settings further down require cheats to be enabled on the
// listen server. This is a local offline server, so this is safe and normal.
sv_cheats 1;
mp_maxrounds 14;
mp_match_can_clinch 1;
mp_overtime_enable 1;

// Stop the game from forcing teams to be even, and stop it from moving
// players between teams. Without these, the manual bot_add lines at the
// bottom of this file get overridden.
mp_limitteams 0;
mp_autoteambalance 0;
mp_autokick 0;

// Restrict death-cam spectating to your own team only. Casual defaults to
// free-roam spectating, which means watching the enemy execute onto you.
mp_forcecamera 1;

// End warmup immediately so the real config takes effect straight away.
mp_warmuptime 0;
mp_warmup_end;


// SECTION 3 - PROHIBITED WEAPONS

// THIS IS THE PART YOUR ORIGINAL CONFIG GOT WRONG.
//
// mp_items_prohibited does NOT accept weapon_ names. It accepts a
// comma-delimited list of numeric weapon definition indices. Passing
// "weapon_hegrenade,weapon_flashbang,..." silently prohibits nothing at all,
// which is why utility kept appearing in your games.
//
// Do not put spaces anywhere in the value. A space ends parsing.
//
// The IDs used below:
//    9  AWP
//   11  G3SG1          (auto sniper)
//   38  SCAR-20        (auto sniper)
//   40  SSG-08         (scout)
//   31  Zeus x27 taser (remove this ID if you want the taser back)
//   43  Flashbang
//   44  HE Grenade
//   45  Smoke Grenade
//   46  Molotov
//   47  Decoy Grenade
//   48  Incendiary Grenade
//
// VERIFY IT WORKED: on a successful prohibition, the game prints the names of
// every prohibited item into the console. If you see nothing printed, the
// string was rejected and you should check for stray spaces.
mp_items_prohibited 9,11,38,40,31,43,44,45,46,47,48;
mp_items_prohibited 9;
mp_buy_allow_guns 239;
bot_allow_snipers 0;

// Belt and braces. mp_items_prohibited blocks buying and equipping, but these
// close off the other routes utility can enter the round through.
mp_buy_allow_grenades 0;
mp_ct_default_grenades "";
mp_t_default_grenades "";
mp_death_drop_grenade 0;

// Remove anything already lying on the map from a previous round or from a
// map's own entity placements.
sv_remove_all_grenades_from_world;

// Bot-side utility switches. Some of these may not exist in your build. If a
// line is rejected the console says "unknown command" and moves on, so an
// unknown line here is harmless noise rather than a failure.
bot_allow_grenades 0;
bot_allow_flash 0;
bot_allow_hegrenades 0;
bot_allow_smokes 0;
bot_allow_molotovs 0;

// Bots must not buy or use sniper rifles. This only covers the bots. The
// mp_items_prohibited line above is what removes snipers from the map for
// everyone, you included.

// SECTION 4 - ECONOMY

// Standard competitive economy. The plugin has its own economy management
// and treats round one as a genuine pistol round regardless of how much
// money bots are holding. Setting mp_startmoney high only enriched the
// human player, so the pistol round was 16000 against 800 in practice.
// Matching the standard values puts both sides on the same footing.
mp_startmoney 800;
mp_maxmoney 16000;

// mp_afterroundmoney is deliberately NOT set here. Leaving it at default
// lets round wins and losses actually mean something, which is what makes
// the plugin's economy logic worth having. Setting it to 16000 gave every
// round a full buy and flattened the whole thing.

// Bots weight armour heavily in their buy decisions so they turn up with it.
sv_bot_buy_armor_weight 1000;

// Free armour, no helmet. Deliberate: without helmets a rifle headshot is a
// one-shot kill in both directions, which is the point of a gun-only mode.
// Change to 2 if you would rather everyone had a helmet.
mp_free_armor 2;

// Remove the shorthanded bonus. With uneven teams it distorts the economy.
cash_team_bonus_shorthanded 0;
cash_team_bonus_shorthanded_count 0;
cash_team_bonus_shorthanded_gold_0 0;

bot_allow_rogues 0;

// These two make bots on YOUR team stand back and let you take the objective
// and the good weapons. Your original config had both at 1. If you are playing
// CT and the bots you care about are on T, this had no effect on them either
// way, but leaving it at 0 means bots on both sides actually play the round.
bot_defer_to_human_items 1;

bot_chatter normal;

mp_friendlyfire 0;


cl_removedecals;
r_csgo_render_decals false;
r_drawdecals false;
r_drawchickens 0;

mp_freezetime 8;
mp_roundtime 1.92;
mp_roundtime_defuse 1.92;
mp_halftime 1;
mp_match_can_clinch 1;


// GATHER A HUGE AMOUNT OF DATA ON A NEW MAP
mp_maxrounds 300;
mp_winlimit 150;
bot_defer_to_human_items 0;

mp_restartgame 1;

